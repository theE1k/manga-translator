<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#111; --mut:#777; --acc:#e4572e; --line:#ddd; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1c1e; --fg:#eee; --mut:#999; --line:#333; } }
  body { font: 14px -apple-system, system-ui, sans-serif; margin: 0; padding: 14px; width: 290px; background: var(--bg); color: var(--fg); }
  h1 { font-size: 16px; margin: 0 0 12px; }
  label { display: block; margin: 10px 0 4px; color: var(--mut); font-size: 12px; }
  input[type=text], input[type=password], select { width: 100%; box-sizing: border-box; padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--fg); font-size: 14px; }
  .row { display: flex; gap: 8px; } .row > div { flex: 1; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--fg); font-size: 14px; }
  button { width: 100%; margin-top: 14px; padding: 10px; border: 0; border-radius: 10px; background: var(--acc); color: #fff; font-size: 15px; font-weight: 600; }
  button.sec { background: transparent; color: var(--fg); border: 1px solid var(--line); margin-top: 8px; }
  #status { margin-top: 8px; font-size: 12px; color: var(--mut); min-height: 16px; }
</style>
</head>
<body>
  <h1>Manga Translator</h1>
  <div class="row">
    <div><label>原文</label>
      <select id="src"><option value="ja">日语</option><option value="ko">韩语</option><option value="zh">中文</option><option value="en">英语</option></select></div>
    <div><label>译文</label>
      <select id="tgt"><option value="zh">简体中文</option><option value="zh-TW">繁體中文</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option></select></div>
  </div>
  <label>服务器地址（Mac 上运行 ./run.sh 显示的地址）</label>
  <input type="text" id="server" placeholder="http://192.168.1.10:8765">
  <label>访问令牌（可选，对应 MT_TOKEN）</label>
  <input type="password" id="token">
  <div class="check"><input type="checkbox" id="auto"> <span>自动翻译（滚动到哪翻到哪）</span></div>
  <div class="check"><input type="checkbox" id="button"> <span>在漫画页显示悬浮按钮</span></div>
  <button id="go">翻译当前页面</button>
  <button id="orig" class="sec">原图 / 译文 切换</button>
  <div id="status"></div>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
